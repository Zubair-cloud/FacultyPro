<section id="page-hod-students" class="page hidden min-h-screen bg-[var(--bg-primary)] pb-32">
        <div class="safe-area-top"></div>
        
        <!-- Header -->
        <div class="p-4 flex items-center gap-3 border-b border-white/10">
            <button onclick="UI.nav('page-hod-panel')" 
                class="size-10 rounded-full bg-white/5 flex items-center justify-center">
                <span class="material-symbols-outlined text-white">arrow_back</span>
            </button>
            <div class="flex-1">
                <h2 id="hod-students-class-name" class="text-white font-bold text-lg">Class A14</h2>
                <p id="hod-students-mentor-info" class="text-xs text-gray-500">Mentors: Loading...</p>
            </div>
        </div>
        
        <!-- Stats Bar -->
        <div class="p-4 flex items-center justify-between bg-white/5">
            <div id="hod-students-count" class="text-sm text-gray-400">
                <span class="text-white font-bold">0</span> students
            </div>
            <select id="hod-students-sort" onchange="HOD.sortStudentList(this.value)"
                class="bg-black/30 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white">
                <option value="lowest">Lowest First</option>
                <option value="highest">Highest First</option>
                <option value="name">Alphabetical</option>
                <option value="regNo">By Reg. No</option>
            </select>
        </div>
        
        <!-- Student List -->
        <div id="hod-students-list" class="p-4 space-y-2">
            <div class="text-center text-gray-500 py-8">Loading students...</div>
        </div>
    </section>
